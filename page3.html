<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>শেষ চিঠি ❤️ | Liza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: radial-gradient(circle at center, #4a0022, transparent 50%),
                linear-gradient(135deg, #0d000d, #260013, #080008);
    color: white;
    font-family: 'Hind Siliguri', serif;
    text-align: center;
    overflow-x: hidden;
    position: relative;
}

/* Background Floating Particles Canvas */
#bgCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}

.container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    z-index: 2;
}

.diary {
    max-width: 750px;
    width: 100%;
}

.locked-box {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 50px 30px;
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(255, 57, 120, 0.2);
}

.locked {
    font-size: 90px;
    cursor: pointer;
    filter: drop-shadow(0 0 25px #ff3978);
    transition: transform 0.4s ease;
    display: inline-block;
    animation: pulse 2s infinite;
}

.locked:hover {
    transform: scale(1.15) rotate(-5deg);
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}

.hint {
    margin-top: 20px;
    color: #ffc7d8;
    font-size: 20px;
    letter-spacing: 0.5px;
}

.letter {
    display: none;
    background: #fffdfa;
    color: #4b1727;
    padding: 45px 35px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(255, 57, 120, 0.35);
    text-align: left;
    position: relative;
    animation: fadeIn 1s ease forwards;
}

.letter:before {
    content: "";
    position: absolute;
    inset: 12px;
    border: 2px dashed #e8adb8;
    border-radius: 6px;
    pointer-events: none;
}

.letter h1 {
    text-align: center;
    color: #9d1748;
    margin-bottom: 25px;
    font-size: 34px;
    font-weight: 700;
}

#typing {
    font-size: 20px;
    line-height: 2;
    min-height: 250px;
    white-space: pre-line;
}

.final {
    display: none;
    margin-top: 50px;
    text-align: center;
    animation: fadeIn 1.2s ease forwards;
}

.final h2 {
    font-size: 48px;
    color: #ff8fb5;
    text-shadow: 0 0 25px #ff1768;
    margin-top: 15px;
}

.final p {
    margin-top: 20px;
    font-size: 20px;
    color: #ffd9e5;
    line-height: 1.8;
}

.cake {
    font-size: 90px;
    display: inline-block;
    animation: bounce 1.2s infinite alternate;
}

@keyframes bounce {
    to { transform: translateY(-15px); }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.confetti {
    position: fixed;
    top: -30px;
    font-size: 25px;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 10;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<canvas id="bgCanvas"></canvas>

<div class="container">
    <div class="diary">
        
        <div id="locked" class="locked-box">
            <div class="locked" onclick="openDiary()">📖</div>
            <div class="hint">চিঠিটা খুলতে ডায়েরিতে একটি স্পর্শ করো ❤️</div>
        </div>

        <div class="letter" id="letter">
            <h1>💌 Liza-এর জন্য</h1>
            <div id="typing"></div>
        </div>

        <div class="final" id="final">
            <div class="cake">🎂</div>
            <h2>HAPPY BIRTHDAY LIZA ❤️</h2>
            <p>
                আল্লাহ তাআলা তোমার জীবনকে রহমত ও বরকতে ভরিয়ে দিক। 🌹<br><br>
                প্রতিটি দিন ভরে উঠুক শান্তিতে 🤲<br><br>
                উভয় জাহানে আল্লাহ তোমাকে উত্তম সফলতা দান করুন। 💕
            </p>
        </div>

    </div>
</div>

<script>
const message = `প্রিয় লেদু 🙂,
রবীন্দ্রনাথ লিখেছিলেন, তোমারে যেন ভালোবাসিয়াছি শত রূপে শত বার, জনমে জনমে যুগে যুগে অনাদিকাল হতে। কথাটার আসল অর্থ আগে বুঝতাম না, কিন্তু তোমাকে ভালোবাসার পর থেকে মনে হয়—আমার এই জন্মটা যেন শুধু তোমার সাথে দেখা হওয়ার জন্যই নির্দিষ্ট ছিল।
আজকের দিনটা ক্যালেন্ডারের অন্য যেকোনো সাধারণ দিনের মতো হতে পারে, কিন্তু আমার কাছে এটা বর্ষার প্রথম কদম ফোটার মতো বিশেষ। জীবনানন্দ দাশ যেমন লিখেছিলেন, সব পাখি ঘরে ফেরে— সব নদী— এ জীবনের সব লেনদেন সমাপ্তি হয় সত্যি বলতে, আমার সারাদিনের সমস্ত ব্যস্ততা, বিষণ্নতা আর ক্লান্তি এসে থামে শুধু তোমার ওই একটুকরো হাসিতে। তুমিই আমার সেই শান্তির নীড়।
আজ তোমার জন্মদিনে কোনো দামি উপহার দেওয়ার চেয়ে বরং রবীন্দ্রনাথের সুরেই বলতে চাই— তোমারে পাওয়ার মাঝে নিজেকে পাই। তোমার সাথে কাটানো প্রতিটি মুহূর্ত, প্রতিটি ছোট ছোট ঝগড়া আর অভিমানও আমার কাছে একেকটা কবিতার মতো সুন্দর।
জীবনের বাকি পথগুলো যত কঠিনই হোক না কেন, নজরুল যেমন বীরের মতো ভালোবেসেছিলেন, আমিও ঠিক তেমনি তোমার হাতটা আঁকড়ে ধরে একসাথে হেঁটে যেতে চাই। আমার প্রতিটি মেঘলা দিনে রোদের আলো হয়ে থেকো।
অনেক ভালোবাসা আর দোয়া রইলো শুভ জন্মদিন, আমার প্রিয়তমা!
তোমার,
বুচকা মুনি;

function openDiary() {
    document.getElementById("locked").style.display = "none";
    document.getElementById("letter").style.display = "block";
    typeText();
}

let index = 0;
function typeText() {
    if (index < message.length) {
        document.getElementById("typing").innerHTML += message.charAt(index);
        index++;
        setTimeout(typeText, 40);
    } else {
        setTimeout(showFinal, 1200);
    }
}

function showFinal() {
    document.getElementById("final").style.display = "block";
    startConfetti();
    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}

/* Floating Particle Animation */
const canvas = document.getElementById("bgCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const particles = [];
for (let i = 0; i < 35; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 4 + 1,
        speedY: Math.random() * 0.8 + 0.2,
        opacity: Math.random() * 0.5 + 0.3
    });
}

function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "rgba(255, 182, 193, 0.7)";

    particles.forEach((p) => {
        ctx.globalAlpha = p.opacity;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        p.y -= p.speedY;
        if (p.y < 0) {
            p.y = canvas.height;
            p.x = Math.random() * canvas.width;
        }
    });

    requestAnimationFrame(animateParticles);
}
animateParticles();

/* Confetti Effect */
function startConfetti() {
    for (let i = 0; i < 120; i++) {
        let c = document.createElement("div");
        c.className = "confetti";
        c.innerHTML = ["❤️", "💕", "✨", "🎉", "🌹"][Math.floor(Math.random() * 5)];
        c.style.left = Math.random() * 100 + "vw";
        c.style.animationDuration = (2.5 + Math.random() * 4) + "s";
        c.style.animationDelay = Math.random() * 2 + "s";

        document.body.appendChild(c);
        setTimeout(() => c.remove(), 7000);
    }
}
</script>

</body>
</html>
